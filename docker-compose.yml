version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orgpass}
      POSTGRES_DB: ${POSTGRES_DB:-orgdb}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orguser} -d ${POSTGRES_DB:-orgdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-orguser}:${POSTGRES_PASSWORD:-orgpass}@db:5432/${POSTGRES_DB:-orgdb}
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  test:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-orguser}:${POSTGRES_PASSWORD:-orgpass}@db:5432/${POSTGRES_DB:-orgdb}
    command: ["pytest", "tests/", "-v", "--tb=short"]
    profiles:
      - test

volumes:
  pg_data:
